<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recipes & Ratings</title>
<style>
    body {
        background:#111;
        color:#eee;
        font-family:sans-serif;
        margin:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100vh;
        text-align:center;
    }
    h1 {
        font-size:2.5rem;
        /* border removed per request */
        padding:10px 20px;
        border-radius:8px;
    }
    p {
        max-width:800px;
        line-height:1.5;
        margin-top:20px;
    }
    .btn {
        border:2px solid #eee;
        padding:8px 12px;
        border-radius:4px;
        display:inline-block;
        text-decoration:none;
        color:#eee;
    }
    .gallery { display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
    .gallery img { max-width:100%; height:auto; cursor:pointer; display:block; }
    .label {font-size: 0.9rem; color: #aaa; text-align:center; margin-top:5px; }
    .stickers { font-size:2rem; margin-top:10px; }
</style>
</head>
<body>
<h1>Recipes & Ratings</h1>
<div class="stickers">🍕🍔🍣🍜🍰</div>
<p><a href="https://jpswag.github.io/recipes-and-ratings/" class="btn" target="_blank" rel="noopener">View project report</a></p>
</body>
</html>
