    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Silkscreen', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
        }
        .card-wrap {
            width: 100vw;
            height: 100vh;
            padding: 0;
            border-radius: 0;
            background: linear-gradient(135deg, #FFFC00, #FFD600, #FFC107, #FFFC00);
            background-size: 300% 300%;
            animation: shimmer 3s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 36px 44px;
            border-radius: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #FFFC00;
            display: flex; align-items: center; justify-content: center;
        }
        .icon svg { width: 42px; height: 42px; fill: #1a1a2e; }
        h2 {
            font-size: 22px;
            margin-bottom: 4px;
            color: #FFFC00;
        }
        .handle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 22px;
        }
        .btn {
            display: inline-block;
            padding: 12px 36px;
            background: #FFFC00;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Silkscreen', sans-serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 18px rgba(255, 252, 0, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 252, 0, 0.5);
        }
    </style>
</head>
