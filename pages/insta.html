<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - zegroopepe</title>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Silkscreen', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a2e;
        }
        .card-wrap {
            width: 100vw;
            height: 100vh;
            padding: 0;
            border-radius: 0;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888, #f09433);
            background-size: 300% 300%;
            animation: gradientShift 4s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 36px 44px;
            border-radius: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex; align-items: center; justify-content: center;
        }
        .icon svg { width: 40px; height: 40px; fill: #fff; }
        h2 {
            font-size: 22px;
            margin-bottom: 4px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .handle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 22px;
        }
        .btn {
            display: inline-block;
            padding: 12px 36px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Silkscreen', sans-serif;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 18px rgba(220, 39, 67, 0.35);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(220, 39, 67, 0.5);
        }
    </style>
</head>
<body>
    <div class="card-wrap">
        <div class="card">
            <div class="icon">

            </div>
            <h2>Instagram</h2>
            <p class="handle">@zegroopepe</p>
            <a class="btn" href="https://www.instagram.com/zegroopepe" target="_blank" rel="noopener">Open Profile</a>
        </div>
    </div>
</body>
</html>
