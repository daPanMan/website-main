<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>This is John Pan</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">
</head>
<body>
<audio id="bgm" loop>
    <source src="assets/audio/website.mp3" type="audio/mpeg">
</audio>
<!-- ✅ Fullscreen Intro Page -->
<div id="intro-page" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; display: flex; justify-content: center; align-items: center; z-index: 300;">

    <button id="enter-button" style="background: rgba(255, 255, 255, 0.9); border: none; padding: 20px 40px; font-size: 24px; font-weight: bold; cursor: pointer; border-radius: 10px; transition: transform 0.3s ease, opacity 0.3s ease; max-width: 85vw; text-align: center; line-height: 1.4; -webkit-tap-highlight-color: transparent;">Click Me and You'll Find Out Who I Am!!!</button>
</div>
<!-- Language toggle — always visible top-right -->
<!-- stopPropagation prevents clicks from bubbling to the 3D scene's window click handler -->
<div id="lang-toggle" style="position: fixed; top: 22px; right: 24px; display: flex; align-items: center; gap: 4px; z-index: 400;"
     onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()">
    <button id="lang-en" onclick="setPageLang('en')" style="background: none; border: none; color: white; font-size: 15px; font-weight: bold; cursor: pointer; padding: 6px 12px; border-radius: 6px; letter-spacing: 0.5px; transition: opacity 0.2s, background 0.2s; -webkit-tap-highlight-color: transparent;">EN</button>
    <span style="color: rgba(255,255,255,0.35); font-size: 14px; user-select: none;">|</span>
    <button id="lang-zh" onclick="setPageLang('zh')" style="background: none; border: none; color: white; font-size: 15px; font-weight: bold; cursor: pointer; padding: 6px 12px; border-radius: 6px; letter-spacing: 0.5px; transition: opacity 0.2s, background 0.2s; -webkit-tap-highlight-color: transparent;">中文</button>
</div>
<div id="volume-control" style="position: fixed; top: 20px; left: 20px; z-index: 100; cursor: pointer;">
    <span id="music-icon" style="font-size: 44px; filter: brightness(5); user-select: none; display: inline-block;">🎵</span>
    <div id="volume-slider-container" style="display: none; position: absolute; top: 200%; left: -114%; transform: rotate(270deg); background: rgba(0, 0, 0, 0.8); padding: 5px; border-radius: 5px;">
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.45" style="writing-mode: bt-lr; width: 200px;">
    </div>
    <button id="mute-button" style="background: none; display: none; border: none; top: 100%; color: white; font-size: 30px; margin-top: 17px; margin-left: 9px; cursor: pointer;">🔊</button>
</div>
<div id="reset-scale-button" style="position: fixed; top: 65px; right: 20px; z-index: 200; cursor: pointer; background: rgba(0, 0, 0, 0.8); color: white; padding: 10px 15px; border-radius: 5px; font-size: 14px; user-select: none; display: none;">Close Page</div>

<!-- Space Tour rocket button + back button -->
<button id="space-tour-btn" title="Space Tour">🛸</button>
<button id="space-tour-back" title="Exit Space Tour">✕ Exit Tour</button>

<!-- AI Chatbox -->
<div id="chatbox" class="chatbox-collapsed">
    <div id="chatbox-header">
        <span id="chatbox-title">💬 Chat with John</span>
        <button id="chatbox-toggle">−</button>
    </div>
    <div id="chatbox-body">
        <div id="chatbox-messages">
            <div class="chat-msg bot">Hey! I'm John. Ask me anything about myself or this site!</div>
        </div>
        <div id="chatbox-input-area">
            <input type="text" id="chatbox-input" placeholder="Type a message..." autocomplete="off">
            <button id="chatbox-send">➤</button>
        </div>
    </div>
</div>

    <canvas id="three-canvas"></canvas>

    <!-- Loading indicator (shown if CDN deps fail) -->
    <div id="dep-loader" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;color:#888;font-family:Consolas,monospace;font-size:13px;text-align:center;pointer-events:none;display:none;"></div>

    <!-- CDN dependencies (static tags for reliability) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/geometries/TextGeometry.js"></script>

    <!-- Post-load check: if any dep failed, retry from fallback CDN -->
    <script>
    (function() {
        var loaderEl = document.getElementById('dep-loader');
        var missing = [];
        var checks = [
            { name: 'Three.js',       ok: function(){ return !!window.THREE; },
              url: 'https://unpkg.com/three@0.136.0/build/three.min.js' },
            { name: 'OrbitControls',   ok: function(){ return !!(window.THREE && window.THREE.OrbitControls); },
              url: 'https://unpkg.com/three@0.136.0/examples/js/controls/OrbitControls.js' },
            { name: 'GSAP',            ok: function(){ return !!window.gsap; },
              url: 'https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js' },
            { name: 'CSS3DRenderer',   ok: function(){ return !!(window.THREE && window.THREE.CSS3DRenderer); },
              url: 'https://unpkg.com/three@0.136.0/examples/js/renderers/CSS3DRenderer.js' },
            { name: 'FontLoader',      ok: function(){ return !!(window.THREE && window.THREE.FontLoader); },
              url: 'https://unpkg.com/three@0.136.0/examples/js/loaders/FontLoader.js' },
            { name: 'TextGeometry',    ok: function(){ return !!(window.THREE && window.THREE.TextGeometry); },
              url: 'https://unpkg.com/three@0.136.0/examples/js/geometries/TextGeometry.js' }
        ];

        // Find which deps failed
        for (var i = 0; i < checks.length; i++) {
            if (!checks[i].ok()) missing.push(checks[i]);
        }

        if (missing.length === 0) return; // all loaded fine, proceed normally

        // Show loading indicator and retry from fallback CDN
        loaderEl.style.display = 'block';
        loaderEl.textContent = 'Retrying ' + missing.length + ' failed dependency(s)...';

        var loaded = 0;
        var failed = [];

        function tryLoad(dep) {
            var s = document.createElement('script');
            s.src = dep.url;
            s.onload = function() {
                loaded++;
                if (dep.ok()) { checkDone(); }
                else { failed.push(dep.name); checkDone(); }
            };
            s.onerror = function() {
                loaded++;
                failed.push(dep.name);
                checkDone();
            };
            document.head.appendChild(s);
        }

        function checkDone() {
            if (loaded < missing.length) return;
            if (failed.length > 0) {
                loaderEl.style.color = '#ff6b6b';
                loaderEl.style.pointerEvents = 'auto';
                loaderEl.innerHTML = 'Failed to load: ' + failed.join(', ') +
                    '.<br><span style="cursor:pointer;text-decoration:underline;color:#74b9ff;" onclick="location.reload()">Click to retry</span>';
            } else {
                loaderEl.style.display = 'none';
                // Deps recovered — now load the app
                location.reload();
            }
        }

        // Load missing deps sequentially (order matters for THREE addons)
        function loadSequential(idx) {
            if (idx >= missing.length) return;
            var s = document.createElement('script');
            s.src = missing[idx].url;
            s.onload = function() {
                if (!missing[idx].ok()) {
                    failed.push(missing[idx].name);
                }
                loaded++;
                if (loaded >= missing.length) checkDone();
                else loadSequential(idx + 1);
            };
            s.onerror = function() {
                failed.push(missing[idx].name);
                loaded++;
                if (loaded >= missing.length) checkDone();
                else loadSequential(idx + 1);
            };
            document.head.appendChild(s);
        }
        loadSequential(0);
    })();
    </script>

    <!-- Language bootstrap — runs before ES modules so getLang() is ready -->
    <script>
    // Expose setPageLang globally so onclick handlers in HTML can call it
    // Hot-switches language in-place without reloading the page.
    function setPageLang(lang) {
        if (localStorage.getItem('lang') === lang) return;
        localStorage.setItem('lang', lang);
        var isZh = lang === 'zh';
        document.getElementById('html-root').lang = lang;
        document.title = isZh ? '我是潘栋' : 'This is John Pan';

        // Immediately swap all DOM strings so there's zero lag before the 3D scene catches up
        var enterBtn = document.getElementById('enter-button');
        if (enterBtn) enterBtn.textContent = isZh ? '点击，探索我的世界！！！' : "Click Me and You'll Find Out Who I Am!!!";
        var closeBtn = document.getElementById('reset-scale-button');
        if (closeBtn && closeBtn.style.display !== 'none') {
            // Don't swap close button text here — cube-logic handles it via langchange
        }

        var enBtn = document.getElementById('lang-en');
        var zhBtn = document.getElementById('lang-zh');
        if (enBtn) { enBtn.style.opacity = isZh ? '0.4' : '1'; enBtn.style.fontWeight = isZh ? 'normal' : 'bold'; }
        if (zhBtn) { zhBtn.style.opacity = isZh ? '1' : '0.4'; zhBtn.style.fontWeight = isZh ? 'bold' : 'normal'; }

        window.dispatchEvent(new CustomEvent('langchange', { detail: { lang: lang } }));
    }

    (function () {
        var lang = localStorage.getItem('lang') || 'en';
        var isZh = lang === 'zh';

        // Set <html lang> attribute
        document.getElementById('html-root').lang = lang;

        // Localised strings for DOM elements set before modules load
        document.title  = isZh ? '我是潘栋'                           : 'This is John Pan';
        var enterText   = isZh ? '点击，探索我的世界！！！'           : "Click Me and You'll Find Out Who I Am!!!";
        var closeText   = isZh ? '关闭页面'                           : 'Close Page';

        // Update enter button (already in DOM at this point)
        var enterBtn = document.getElementById('enter-button');
        if (enterBtn) enterBtn.textContent = enterText;

        // Update close-page button
        var closeBtn = document.getElementById('reset-scale-button');
        if (closeBtn) closeBtn.textContent = closeText;

        // Style the active language button
        var enBtn = document.getElementById('lang-en');
        var zhBtn = document.getElementById('lang-zh');
        if (enBtn) { enBtn.style.opacity = isZh ? '0.4' : '1'; }
        if (zhBtn) { zhBtn.style.opacity = isZh ? '1' : '0.4'; }
    })();
    </script>

    <!-- App entry point (runs after all CDN deps above) -->
    <script type="module" src="src/main.js"></script>

    <!-- Hidden Display Box for Clicked Cube -->
    <div id="popup" hidden>
        <span id="close-popup">X</span>
        <p id="popup-text"></p>
    </div>
    <div id="iframe-container">
        <iframe id="embedded-page" src="about.html" style="overflow: auto; height: 100%; width: 150%;" scrolling="yes" hidden></iframe>
    </div>
</body>
</html>
